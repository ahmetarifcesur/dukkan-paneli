<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>Dükkan Paneli</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Giriş / ilk kurulum -->
  <section id="auth" class="auth" hidden></section>

  <div class="app" id="app" hidden>
    <aside class="sidebar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9h16l-1.5-5h-13z"/><path d="M5 9v11h14V9"/><path d="M10 20v-6h4v6"/></svg>
        </span>
        <div class="brand-text"><strong id="shop-name">Dükkan</strong><small>Yönetim paneli</small></div>
      </div>
      <nav class="nav" aria-label="Bölümler">
        <a href="#dashboard" data-view="dashboard" data-owner><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Genel Bakış</span></a>
        <a href="#satis" data-view="satis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12.4a1.5 1.5 0 0 0 1.5 1.1h8.8a1.5 1.5 0 0 0 1.5-1.2L21 7H6"/></svg><span>Satış</span></a>
        <a href="#satislar" data-view="satislar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span>Satışlar &amp; Fişler</span></a>
        <a href="#finans" data-view="finans" data-owner><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/></svg><span>Gelir &amp; Gider</span></a>
        <a href="#urunler" data-view="urunler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg><span>Ürünler &amp; Stok</span><span class="badge" hidden></span></a>
        <a href="#hareketler" data-view="hareketler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg><span>Stok Hareketleri</span></a>
        <a href="#tedarikciler" data-view="tedarikciler" data-owner><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 7h11v9H2zM13 10h4l4 3v3h-8z"/><circle cx="6.5" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>Tedarikçiler</span></a>
        <a href="#borclar" data-view="borclar" data-owner><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg><span>Borç &amp; Alacak</span><span class="badge" hidden></span></a>
        <a href="#takvim" data-view="takvim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Takvim</span><span class="badge" hidden></span></a>
        <a href="#raporlar" data-view="raporlar" data-owner><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Raporlar</span></a>
        <a href="#gecmis" data-view="gecmis" data-owner><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg><span>İşlem Geçmişi</span></a>
        <a href="#ayarlar" data-view="ayarlar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Ayarlar</span></a>
      </nav>
      <div class="userbox">
        <div class="userbox-text"><strong id="user-name"></strong><small id="user-role"></small></div>
        <button class="icon-btn" data-action="logout" title="Çıkış yap" aria-label="Çıkış yap">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="view-title">Genel Bakış</h1>
          <p id="today-label"></p>
        </div>
        <div class="top-actions">
          <button class="icon-btn bell" data-action="show-notifications" title="Bildirimler" aria-label="Bildirimler">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
            <span class="bell-count" id="bell-count" hidden></span>
          </button>
          <button class="icon-btn" data-action="toggle-theme" title="Açık / koyu tema" aria-label="Temayı değiştir">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>
          </button>
        </div>
      </header>
      <section id="view" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="modal" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="icon-btn" data-action="close-modal" aria-label="Kapat">✕</button>
    </div>
    <div id="modal-body"></div>
  </dialog>

  <dialog id="confirm" class="confirm" aria-labelledby="confirm-text">
    <p id="confirm-text"></p>
    <p class="form-error" id="confirm-error" hidden></p>
    <div class="form-actions">
      <button class="btn ghost" data-action="confirm-no">Vazgeç</button>
      <button class="btn danger" id="confirm-yes" data-action="confirm-yes">Sil</button>
    </div>
  </dialog>

  <div id="print-area" aria-hidden="true"></div>
  <div id="toasts" aria-live="polite"></div>
  <script src="js/core.js"></script>
  <script src="js/views-ops.js"></script>
  <script src="js/views-admin.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
